<header class="site-header">
  <div class="wrapper">
    <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="ArtistUniverse, home">
      <span class="site-logo-text">ArtistUniverse</span>
      <svg class="site-logo-icon" width="58" height="50" viewBox="0 0 54 46" fill="none" aria-hidden="true">
        <!-- stars -->
        <path d="M6 6v7M2.5 9.5h7" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M47 4l1 2.4 2.6.3-2 1.7.6 2.6-2.2-1.4-2.2 1.4.6-2.6-2-1.7 2.6-.3z" fill="#d4af37"/>
        <circle cx="49" cy="34" r="1.4" fill="#d4af37"/>
        <circle cx="4" cy="36" r="1.1" fill="currentColor"/>
        <!-- alien antennae -->
        <path d="M22.5 8L19.5 2.5M29.5 8l3-5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="19.2" cy="2.3" r="1.8" fill="#d4af37" stroke="currentColor" stroke-width="1"/>
        <circle cx="32.8" cy="2.3" r="1.8" fill="#d4af37" stroke="currentColor" stroke-width="1"/>
        <!-- alien head -->
        <ellipse cx="26" cy="14" rx="8.5" ry="7.5" fill="#a78bfa" stroke="currentColor" stroke-width="1.6"/>
        <ellipse cx="22.6" cy="13" rx="2.1" ry="2.8" fill="#1c1b18" transform="rotate(-20 22.6 13)"/>
        <ellipse cx="29.4" cy="13" rx="2.1" ry="2.8" fill="#1c1b18" transform="rotate(20 29.4 13)"/>
        <circle cx="23.1" cy="12" r="0.7" fill="#ffffff"/>
        <circle cx="29.9" cy="12" r="0.7" fill="#ffffff"/>
        <!-- earth -->
        <clipPath id="au-earth-clip"><circle cx="26" cy="31" r="14"/></clipPath>
        <circle cx="26" cy="31" r="14" fill="#3b82c4"/>
        <g clip-path="url(#au-earth-clip)">
          <path d="M13 20c4-2 9-1 10 2s-2 5-4 6 0 4 2 6 1 7-2 9-5 0-6-3-1-5-3-8-2-9 3-12z" fill="#4caf50"/>
          <path d="M29 18c4-1 9 0 11 3s-1 4-3 5 1 5 0 8-3 7-6 8-2-4-1-7-2-4-1-8 0-7 0-9z" fill="#4caf50"/>
          <path d="M36 39c2-1 4 0 4 2s-2 2-4 1z" fill="#4caf50"/>
          <path d="M12 31h28M14 24q12 4 24 0M14 38q12-4 24 0" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.35"/>
          <ellipse cx="26" cy="31" rx="6" ry="14" stroke="#ffffff" stroke-width="0.9" opacity="0.35"/>
        </g>
        <circle cx="26" cy="31" r="14" stroke="currentColor" stroke-width="1.6"/>
        <!-- alien hands -->
        <circle cx="18.5" cy="19.5" r="2.4" fill="#a78bfa" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="33.5" cy="19.5" r="2.4" fill="#a78bfa" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </a>
    <nav class="site-nav">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About Me</a>
      <a href="https://notes.artistuniverse.tech" target="_blank" rel="noopener">Notes</a>
      <button class="search-toggle" aria-label="Search">
        <i class="fas fa-search"></i>
      </button>
    </nav>
  </div>
</header>

<!-- Search Modal -->
<div class="search-modal" id="searchModal">
  <div class="search-modal-content">
    <button class="search-close" aria-label="Close search">
      <i class="fas fa-times"></i>
    </button>
    <input type="text" id="searchInput" placeholder="Search posts..." autocomplete="off">
    <div id="searchResults"></div>
  </div>
</div>

<script>
// Simple search functionality
document.addEventListener('DOMContentLoaded', function() {
  const searchToggle = document.querySelector('.search-toggle');
  const searchModal = document.getElementById('searchModal');
  const searchClose = document.querySelector('.search-close');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  // Open search
  if (searchToggle) {
    searchToggle.addEventListener('click', function() {
      searchModal.classList.add('active');
      searchInput.focus();
    });
  }

  // Close search
  if (searchClose) {
    searchClose.addEventListener('click', function() {
      searchModal.classList.remove('active');
      searchInput.value = '';
      searchResults.innerHTML = '';
    });
  }

  // Close on escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && searchModal.classList.contains('active')) {
      searchModal.classList.remove('active');
      searchInput.value = '';
      searchResults.innerHTML = '';
    }
  });

  // Close on background click
  searchModal.addEventListener('click', function(e) {
    if (e.target === searchModal) {
      searchModal.classList.remove('active');
      searchInput.value = '';
      searchResults.innerHTML = '';
    }
  });

  // Search posts
  const posts = [
    {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      url: {{ post.url | jsonify }},
      excerpt: {{ post.excerpt | strip_html | truncatewords: 30 | jsonify }},
      date: {{ post.date | date: "%B %d, %Y" | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      
      if (query.length < 2) {
        searchResults.innerHTML = '';
        return;
      }

      const results = posts.filter(post => 
        post.title.toLowerCase().includes(query) || 
        post.excerpt.toLowerCase().includes(query)
      );

      if (results.length === 0) {
        searchResults.innerHTML = '<div class="no-results">No results found</div>';
        return;
      }

      const resultsHTML = results.map(post => `
        <div class="search-result">
          <h3><a href="${post.url}">${post.title}</a></h3>
          <div class="search-result-meta">${post.date}</div>
          <p>${post.excerpt}</p>
        </div>
      `).join('');

      searchResults.innerHTML = resultsHTML;
    });
  }
});
</script>
