- type: work
  title: Senior Associate Security Engineer, AI Cloud Security
  learned: "Shadow AI is a category, so I hunt specific behaviors instead of chasing it as a whole. Local coding agents run as the user and never appear in sign-in logs, vendor docs and the real tenant schema don't always match, and a threat and a policy violation belong to different teams."
  date: 2026-08-01
  end: present
  summary: Building Microsoft-based detection for unauthorized AI tools and agents on a new AI security posture team, using Microsoft Sentinel, Defender advanced hunting and Purview.

- type: work
  title: Associate Cloud Security Consultant
  learned: "Consulting taught me to explain technical findings in business terms, to pick the control that fits how a client actually works (sensitivity label encryption when DLP was too restrictive), and to leave every client able to run what I built through runbooks and handover docs."
  org: Slalom
  date: 2022-09-01
  end: 2026-09-01
  highlights:
    - Automated 100+ registry-level security settings that Intune can't set natively, using PowerShell; adopted as a reusable accelerator on later Slalom Intune migrations.
    - Designed a tiered Active Directory administration model (Tier 0/1/2) for a government contractor preparing for a compliance audit.
    - Piloted phishing-resistant authentication (Microsoft Authenticator and FIDO2) for a global nonprofit, with runbooks the client used to finish the rollout.
    - Remediated 94,000 vulnerabilities across a 200+ server hybrid Windows estate with zero unplanned outages.

