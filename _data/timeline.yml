# Sources: homelab build log (Nov 2026) and TheGuardian.pdf diagram (Apr 2026).
# First seen as "Advanced Multi-Cloud Security Homelab" on the Aug 2025 resume.
# Replaces the earlier "Hybrid Cloud Identity" and "Security Homelab" placeholders.
# Kept high level on purpose: no IPs, internal domain names or account IDs.
- type: project
  title: TheGuardian®️
  date: 2025-01-01
  precision: year
  end: present
  summary: An on-prem Proxmox lab tied into Azure and AWS, designed in tiers (identity, servers, workstations and an isolated AI-agent network) to practice enterprise security end to end.
  highlights:
    - pfSense segmenting the lab into VLANs, and a Windows Server 2025 Active Directory domain running DNS and DHCP, with GPOs for AppLocker, restricted local admins and advanced auditing.
    - Hybrid identity with Microsoft Entra Cloud Sync on a dedicated Tier 0 sync server, password hash sync, and a hybrid-joined Windows 11 client.
    - Microsoft Sentinel collecting Entra audit logs, Azure Activity and Windows security events through the Azure Monitor Agent, with budget and policy guardrails on both clouds.
    - An AWS landing zone in Terraform (org-kickstart) with a security account, organization CloudTrail and GuardDuty, in progress.
  learned: "Entra roles and Azure RBAC are separate systems, hybrid join only works in a set order, and a misleading error can really be a permissions problem. Most important: never connect an AI tool with root or admin rights. I found an AWS connector running as root and rebuilt its access as a read-only sandbox role."

- type: project
  title: Scriptz-R-4-Kidz
  date: 2026-07-14
  summary: The scripts and queries from my IT career, sorted by language, including Active Directory risk assessments, a CIS baseline deployer for Intune through Microsoft Graph, Python utilities and KQL hunts.
  learned: "Writing scripts other people can run safely: deploys that skip unchanged policies so they're safe to re-run, -WhatIf support, and clear warnings to read and test in a lab first."
