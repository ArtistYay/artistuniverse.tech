# ===== Projects =====

- type: project
  title: Git Client from Scratch (CodeCrafters)
  learned: "How Git actually stores data: blobs, trees and commits as zlib-compressed objects addressed by SHA-1. Also practical Python lessons on bytes versus strings, and to solve only the stage in front of me instead of jumping ahead."
  date: 2026-07-08
  summary: A working Git client in Python with no Git libraries, covering blob, tree and commit objects, plus cloning over Git's Smart HTTP protocol with packfile parsing.
  link: https://github.com/ArtistYay/codecrafters-git-python
  link_label: GitHub

- type: project
  title: Azure AppSec Pipeline
  learned: "Structured JSON logging so app logs are useful once they reach Sentinel, Docker layer caching, Terraform variable validation that catches mistakes at plan time, and one codebase with a tfvars file per environment instead of copied code."
  date: 2026-05-02
  summary: Connects CI/CD and the SIEM so deployment and scan results sit next to runtime detections. Azure infrastructure across five reusable Terraform modules, a managed identity scoped to a single role, custom Azure Policy as an independent enforcement layer, and OIDC planned so no static secrets live in CI/CD.
  link: https://github.com/ArtistYay/azure-appsec-pipeline
  link_label: GitHub

- type: project
  title: Defender for Cloud Assessment Tool
  learned: "Turning a repeatable manual assessment into a tool: signing in through the browser, pulling Defender for Cloud and CIS benchmark results, and packaging them as one HTML report a client can act on."
  date: 2026-04-19
  status: archived   # repo archived on GitHub
  summary: Python CLI that snapshots Defender for Cloud (secure score, Defender plan coverage, all 89 CIS Azure Foundations Benchmark rules) and outputs a self-contained HTML report with a remediation tracker. Cut a full Azure security assessment from days to under 10 minutes.
  link: https://github.com/ArtistUniverse/mdc-assessment-tool
  link_label: GitHub

- type: project
  title: Docs-as-Code Security Notes
